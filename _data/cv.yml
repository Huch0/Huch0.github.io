bio: >-
  I am an M.S. student at the Graduate School of Artificial Intelligence, POSTECH, advised by
  Prof. Jungseul Ok in the Machine Learning Lab. My research interests lie in agentic AI —
  especially computer-use agents, terminal agents, multimodal agents, agent harness design,
  and benchmark construction for realistic agent workflows. I am interested in building AI
  agents that can operate over persistent workspaces, interact with tools, and solve tasks
  grounded in complex real-world artifacts such as code, documents, images, audio, and video.

research_interests:
  - Agentic AI
  - Computer-use agents
  - Terminal & CLI/API-based agents
  - Multimodal agents
  - Agent harness design
  - Benchmark construction & evaluation
  - Multimedia-file workflows for AI agents
  - AI agents for document editing & knowledge work

