# --- Site identity ---------------------------------------------------------
title: Chiyeong Heo
tagline: M.S. student, Graduate School of AI, POSTECH
description: >-
  Chiyeong Heo (허치영) — M.S. student in the Machine Learning Lab at POSTECH,
  researching agentic AI: computer-use agents, terminal agents, multimodal agents,
  agent harness design, and benchmark construction.
url: "https://huch0.github.io"
baseurl: ""
lang: en

author:
  name: Chiyeong Heo

# --- Build -----------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Navbar (drives _includes/nav.html) ------------------------------------
nav:
  - title: About
    url: /
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/
  - title: CV
    url: /cv/

# --- Analytics (Google Analytics 4) ----------------------------------------
google_analytics: G-EX60794QM9

# --- Default layout --------------------------------------------------------
defaults:
  - scope:
      path: ""
    values:
      layout: default

# --- Exclude from the Jekyll build -----------------------------------------
exclude:
  - Makefile
  - README.md
  - CONTEXT.md
  - CLAUDE.md
  - AGENTS.md
  - docs/
  - cv/            # LaTeX CV pipeline (source + generator), not web content
  - bib/           # raw .bib sources (rendered copies live under assets/)
  - vendor/
  - Gemfile
  - Gemfile.lock
  - "*.docx"
  - .github/
