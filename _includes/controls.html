<div class="controls">
  <button class="ctrl-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
    <span data-theme-icon="light">{% include icon.html name="sun" %}</span>
    <span data-theme-icon="dark" hidden>{% include icon.html name="moon" %}</span>
  </button>

  <button class="ctrl-btn" id="font-toggle" type="button" aria-haspopup="true" aria-expanded="false"
          aria-label="Choose reading font" title="Reading font">Aa</button>

  <div class="fontmenu" id="font-menu" role="menu" aria-label="Reading font">
    <button role="menuitemradio" data-font-choice="sans"   aria-checked="true">
      <span class="opt-sans">Atkinson</span><span class="sample">accessible</span>
    </button>
    <button role="menuitemradio" data-font-choice="serif"  aria-checked="false">
      <span class="opt-serif">Source Serif</span><span class="sample">reading</span>
    </button>
    <button role="menuitemradio" data-font-choice="system" aria-checked="false">
      <span class="opt-system">System</span><span class="sample">native</span>
    </button>
  </div>

  <button class="ctrl-btn" id="color-toggle" type="button" aria-haspopup="true" aria-expanded="false"
          aria-label="Choose accent color" title="Accent color"><span class="accent-dot"></span></button>

  <div class="colormenu" id="color-menu" role="menu" aria-label="Accent color">
    <button class="swatch" role="menuitemradio" data-accent-choice="teal"     style="--dot:#0f766e" title="Teal" aria-checked="true"></button>
    <button class="swatch" role="menuitemradio" data-accent-choice="burgundy" style="--dot:#9d2449" title="Burgundy" aria-checked="false"></button>
    <button class="swatch" role="menuitemradio" data-accent-choice="pine"     style="--dot:#166534" title="Pine" aria-checked="false"></button>
    <button class="swatch" role="menuitemradio" data-accent-choice="sienna"   style="--dot:#b4530e" title="Burnt Sienna" aria-checked="false"></button>
    <button class="swatch" role="menuitemradio" data-accent-choice="indigo"   style="--dot:#4338ca" title="Indigo" aria-checked="false"></button>
    <button class="swatch" role="menuitemradio" data-accent-choice="crimson"  style="--dot:#be123c" title="Crimson" aria-checked="false"></button>
    <button class="swatch" role="menuitemradio" data-accent-choice="slate"    style="--dot:#2f4a8a" title="Slate Blue" aria-checked="false"></button>
    <button class="swatch" role="menuitemradio" data-accent-choice="plum"     style="--dot:#86328a" title="Plum" aria-checked="false"></button>
  </div>
</div>
