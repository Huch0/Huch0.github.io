# Projects — work done OUTSIDE a publication effort (research that led to a paper
# belongs in publications.yml). Grouped: featured / mentoring / class_projects.
# `*_kr` fields feed the Korean CV; the website uses the English fields.
# Link types render as labels; url "TODO" shows a dashed placeholder button.

# Substantial, self-contained projects.
featured:
  - name: DeepCatch Agent
    award: "1st place · 2025 POSTECH Digital Twin Chatbot Hackathon"
    award_kr: "대상 · 2025 POSTECH 디지털 트윈 챗봇 해커톤"
    role: "Team project with Jun Seo (equal contribution)"
    role_kr: "팀 프로젝트, 서준과 공동 (동등 기여)"
    description: >-
      An AI telephone-reservation assistant for fishing tourists in Pohang's Guryongpo: it
      gathers weather and catch data to recommend personalized fishing plans and automates
      phone bookings with fishing establishments through Twilio voice calls.
    description_kr: >-
      포항 구룡포의 낚시 관광객을 위한 AI 전화 예약 어시스턴트. 날씨·조황 데이터를 수집해 맞춤형 낚시
      계획을 추천하고, Twilio 음성 통화로 낚시 업체 예약을 자동화한다.
    stack: "LangGraph · FastAPI · Twilio · OpenAI Realtime API · Socket.IO · Next.js / TypeScript"
    links:
      - { type: code,     url: "https://github.com/sjin4861/deepcatch-agent" }
      - { type: LinkedIn, url: "https://www.linkedin.com/posts/chiyeong-heo_hackathon-ai-chatbot-ugcPost-7378249881687281664-FaDv/" }

