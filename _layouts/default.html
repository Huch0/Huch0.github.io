<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <script>
    // Apply saved theme/font before first paint to avoid a flash.
    // Default theme is light (per design spec); default font is Atkinson (sans).
    (function () {
      try {
        var d = document.documentElement;
        d.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
        d.setAttribute('data-font', localStorage.getItem('font') || 'sans');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.setAttribute('data-font', 'sans');
      }
    })();
  </script>
  {% include head.html %}
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
      {% include nav.html %}
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      {% include profile-card.html %}
    </aside>
    <div class="content">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
  {% include scripts.html %}
</body>
</html>
