- key: heo2026mmtb
  title: "MMTB: Evaluating Terminal Agents on Multimedia-File Tasks"
  authors:
    - { name: "Chiyeong Heo", me: true }
    - { name: "Jaechang Kim" }
    - { name: "Junhyuk Kwon" }
    - { name: "Hoyoung Kim" }
    - { name: "Dongmin Park" }
    - { name: "Jonghyun Lee" }
    - { name: "Jungseul Ok" }
  year: 2026
  status: "arXiv preprint, 2026"
  selected: true
  abstract: >-
    We introduce MultiMedia-TerminalBench, a benchmark of 105 multimedia-file tasks where
    terminal agents must inspect audio, video, and image files, ground decisions in
    multimedia evidence, and produce verifier-checkable output artifacts. We also study
    multimedia-aware terminal-agent harnesses such as Terminus-MM.
